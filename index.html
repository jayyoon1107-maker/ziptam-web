<!DOCTYPE html>
<html lang="ko">
<head>
  <title>집탐 | 집 보기 전에 먼저 둘러보세요 | ZipTam</title>
  <meta name="description" content="집탐 (ZipTam) — 집 보기 전에 먼저 둘러보세요. 집을 탐색하고 비교하세요.">
  <meta name="keywords" content="집탐, ZipTam, 집검색, 부동산">
  <meta name="robots" content="index, follow">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("https://images.unsplash.com/photo-1538485399081-7c8edc19e801?auto=format&fit=crop&w=1800&q=80");
      background-size: cover;
      background-position: center;
      color: white;
    }

    .nav {
      padding: 28px 48px;
      font-size: 28px;
      font-weight: 700;
    }

    .hero {
      height: calc(100vh - 100px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 72px;
      margin: 0;
    }

    h2 {
      font-size: 36px;
      margin: 12px 0 0;
    }

    p {
      font-size: 28px;
      margin: 30px 0 40px;
      font-weight: 500;
    }

    .search-box {
      display: flex;
      width: 620px;
      max-width: 90%;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    input {
      flex: 1;
      border: none;
      padding: 24px;
      font-size: 20px;
      outline: none;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 0 30px;
      font-size: 20px;
      cursor: pointer;
    }

    .examples {
      margin-top: 22px;
      font-size: 16px;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="nav">ZipTam 집탐</div>

  <div class="hero">
    <h1>ZipTam</h1>
    <h2>집탐</h2>
    <p>집 보기 전에 먼저 둘러보세요</p>

    <div class="search-box">
      <input type="text" placeholder="어느 동네를 둘러보시겠어요? 예: 성수동, 잠실, 방이동">
      <button>검색</button>
    </div>

    <div class="examples">
      인기 검색: 성수동 · 잠실 · 방이동 · 판교 · 미사
    </div>
  </div>
</body>
</html>
