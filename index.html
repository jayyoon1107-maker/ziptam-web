<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>집탐 | 집 보기 전에 먼저 둘러보세요 | ZipTam</title>
<meta name="description" content="집탐 (ZipTam) - 집 보기 전에 먼저 둘러보세요. 원하는 동네와 집을 탐색하세요.">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100vh}

#home{
  height:100vh;
  background:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.32)),url("./Image.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
}

.nav{padding:30px;font-size:32px;font-weight:700}

.hero{
  height:calc(100vh - 100px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1{font-size:90px;margin-bottom:10px}
.hero h2{font-size:34px;margin-bottom:18px}
.hero p{font-size:26px;margin-bottom:60px}

.search{
  width:760px;
  max-width:90%;
  background:white;
  display:flex;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.search input{
  flex:1;
  padding:28px;
  border:none;
  outline:none;
  font-size:22px;
}

.search button{
  width:120px;
  background:black;
  color:white;
  border:none;
  font-size:20px;
  cursor:pointer;
}

#mapPage{display:none;height:100vh}

.mapHeader{
  height:72px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:24px;
  background:white;
  border-bottom:1px solid #ddd;
}

.brand{font-size:24px;font-weight:800;cursor:pointer}
.back{padding:12px 18px;border:none;background:black;color:white;border-radius:10px;cursor:pointer}
#map{height:calc(100vh - 72px)}
</style>
</head>

<body>

<section id="home">
  <div class="nav">ZipTam</div>

  <div class="hero">
    <h1>집탐</h1>
    <h2>집을 탐색하다</h2>
    <p>집 보기 전에 먼저 둘러보세요</p>

    <div class="search">
      <input id="searchInput" placeholder="동네 · 아파트 · 주소 검색">
      <button onclick="searchMap()">검색</button>
    </div>
  </div>
</section>

<section id="mapPage">
  <div class="mapHeader">
    <div class="brand" onclick="goHome()">ZipTam 집탐</div>
    <button class="back" onclick="goHome()">처음으로</button>
  </div>

  <div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let currentMarker;
let boundaryLayer;

const namsan = { lat:37.5512, lng:126.9882, zoom:14 };

const places = [
  { name:"압구정", full:"서울특별시 강남구 압구정동", lat:37.5271, lng:127.0286 },
  { name:"압구정동", full:"서울특별시 강남구 압구정동", lat:37.5271, lng:127.0286 },
  { name:"잠실", full:"서울특별시 송파구 잠실동", lat:37.5065, lng:127.0840 },
  { name:"잠실동", full:"서울특별시 송파구 잠실동", lat:37.5065, lng:127.0840 },
  { name:"방이", full:"서울특별시 송파구 방이동", lat:37.5150, lng:127.1127 },
  { name:"방이동", full:"서울특별시 송파구 방이동", lat:37.5150, lng:127.1127 },
  { name:"성수", full:"서울특별시 성동구 성수동", lat:37.5446, lng:127.0557 },
  { name:"성수동", full:"서울특별시 성동구 성수동", lat:37.5446, lng:127.0557 },
  { name:"미사", full:"경기도 하남시 미사동", lat:37.5672, lng:127.1906 },
  { name:"연수", full:"인천광역시 연수구 연수동", lat:37.4100, lng:126.6783 },
  { name:"연수동", full:"인천광역시 연수구 연수동", lat:37.4100, lng:126.6783 },
  { name:"판교", full:"경기도 성남시 분당구 판교동", lat:37.3947, lng:127.1112 },
  { name:"강남", full:"서울특별시 강남구", lat:37.4979, lng:127.0276 },
  { name:"송파", full:"서울특별시 송파구", lat:37.5145, lng:127.1059 }
];

function clearMapLayers(){
  if(boundaryLayer){
    map.removeLayer(boundaryLayer);
    boundaryLayer = null;
  }

  if(currentMarker){
    map.removeLayer(currentMarker);
    currentMarker = null;
  }
}

async function showMap(lat,lng,zoom,title){
  document.getElementById("home").style.display = "none";
  document.getElementById("mapPage").style.display = "block";

  setTimeout(async () => {
    if(!map){
      map = L.map("map").setView([lat,lng],zoom);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom:19,
        attribution:"© OpenStreetMap"
      }).addTo(map);
    } else {
      map.setView([lat,lng],zoom);
      map.invalidateSize();
    }

    clearMapLayers();

    currentMarker = L.marker([lat,lng])
      .addTo(map)
      .bindPopup(title)
      .openPopup();

    try{
      const response = await fetch(
        `https://nominatim.openstreetmap.org/search?format=geojson&polygon_geojson=1&limit=1&countrycodes=kr&q=${encodeURIComponent(title)}`
      );

      const data = await response.json();

      if(data.features && data.features.length > 0){
        boundaryLayer = L.geoJSON(data.features[0], {
          style:{
            color:"#2563eb",
            weight:3,
            fillColor:"#2563eb",
            fillOpacity:0.15
          }
        }).addTo(map);

        map.fitBounds(boundaryLayer.getBounds());
      }
    } catch(e){
      console.log("경계 불러오기 실패");
    }

  },100);
}

function searchMap(){
  const query = document.getElementById("searchInput").value.trim();

  if(query === ""){
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        position => {
          showMap(position.coords.latitude, position.coords.longitude, 15, "현재 위치");
        },
        () => {
          showMap(namsan.lat, namsan.lng, namsan.zoom, "남산");
        }
      );
    } else {
      showMap(namsan.lat, namsan.lng, namsan.zoom, "남산");
    }
    return;
  }

  const results = places.filter(place =>
    place.name.includes(query) || place.full.includes(query)
  );

  if(results.length === 0){
    alert("검색 결과 없음");
    return;
  }

  if(results.length === 1){
    const selected = results[0];
    showMap(selected.lat, selected.lng, 15, selected.full);
    return;
  }

  const list = results.map((place,index) => `${index+1}. ${place.full}`).join("\n");
  const choice = prompt(`검색 결과가 여러 개 있습니다.\n\n${list}\n\n번호를 입력하세요.`);

  const selected = results[Number(choice)-1];

  if(selected){
    showMap(selected.lat, selected.lng, 15, selected.full);
  }
}

function goHome(){
  document.getElementById("mapPage").style.display = "none";
  document.getElementById("home").style.display = "block";
}
</script>

</body>
</html>
