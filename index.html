<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>집탐 | 집 보기 전에 먼저 둘러보세요</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:-apple-system;
}

#home{

height:100vh;

background:
linear-gradient(
rgba(0,0,0,.35),
rgba(0,0,0,.35)
),
url("./Image.jpeg");

background-size:cover;
background-position:center;

display:flex;

flex-direction:column;

color:white;

}

.header{

padding:30px;

font-size:26px;

font-weight:700;

cursor:pointer;

}

.hero{

flex:1;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

}

.hero h1{

font-size:90px;

margin-bottom:20px;

}

.hero h2{

font-size:50px;

margin-bottom:20px;

}

.hero p{

font-size:18px;

margin-bottom:40px;

}

.search{

display:flex;

width:800px;

max-width:90%;

}

.search input{

flex:1;

padding:28px;

font-size:30px;

border:none;

border-radius:20px 0 0 20px;

}

.search button{

width:170px;

border:none;

background:black;

color:white;

font-size:28px;

cursor:pointer;

border-radius:0 20px 20px 0;

}

#mapPage{

display:none;

height:100vh;

}

.mapHeader{

height:80px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

font-size:28px;

font-weight:700;

}

.mapHeader div{

cursor:pointer;

}

#map{

height:calc(100vh - 80px);

}

</style>

</head>

<body>

<div id="home">

<div
class="header"
onclick="goHome()"
>

ZipTam 집탐

</div>

<div class="hero">

<h2>집탐</h2>

<p>

집 보기 전에 먼저 둘러보세요

</p>

<div class="search">

<input
id="searchInput"
placeholder="동 이름 검색"
/>

<button
onclick="searchMap()"
>

검색

</button>

</div>

</div>

</div>


<div id="mapPage">

<div class="mapHeader">

<div onclick="goHome()">

ZipTam 집탐

</div>

<button onclick="goHome()">

처음으로

</button>

</div>

<div id="map"></div>

</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map

let marker

let boundary


const namsan={

lat:37.5512,

lng:126.9882,

zoom:13

}


const localData={

"압구정":{
lat:37.527,
lng:127.028,
full:"서울특별시 강남구 압구정동"
},

"잠실":{
lat:37.513,
lng:127.101,
full:"서울특별시 송파구 잠실동"
},

"방이동":{
lat:37.511,
lng:127.116,
full:"서울특별시 송파구 방이동"
},

"성수동":{
lat:37.544,
lng:127.056,
full:"서울특별시 성동구 성수동"
},

"미사":{
lat:37.563,
lng:127.193,
full:"경기도 하남시 미사"
},

"연수동":{
lat:37.410,
lng:126.678,
full:"인천광역시 연수구 연수동"
},

"판교":{
lat:37.394,
lng:127.111,
full:"경기도 성남시 판교"
}

}


function showMap(

lat,
lng,
zoom,
title

){

document.getElementById(
"home"
).style.display="none"

document.getElementById(
"mapPage"
).style.display="block"


setTimeout(()=>{

if(!map){

map=L.map("map")

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map)

}


map.setView(
[lat,lng],
zoom
)

if(marker){

map.removeLayer(
marker
)

}

if(boundary){

map.removeLayer(
boundary
)

}


marker=

L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup(
title
)

.openPopup()


boundary=

L.circle(

[lat,lng],

{

radius:1500,

color:"blue",

fill:true,

fillOpacity:.1

}

)

.addTo(map)

map.invalidateSize()

},150)

}



async function searchMap(){

const q=

document
.getElementById(
"searchInput"
)
.value
.trim()


if(!q){

showMap(

namsan.lat,

namsan.lng,

14,

"남산"

)

return

}


if(localData[q]){

showMap(

localData[q].lat,

localData[q].lng,

15,

localData[q].full

)

return

}


try{

const url=

`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+" 한국")}`


const res=

await fetch(
url
)

const data=

await res.json()


if(data.length){

showMap(

Number(
data[0].lat
),

Number(
data[0].lon
),

15,

data[0].display_name

)

}

else{

alert(

"검색 결과 없음"

)

}

}

catch{

alert(

"검색 실패"

)

}

}


function goHome(){

document
.getElementById(
"mapPage"
)
.style
.display="none"


document
.getElementById(
"home"
)
.style
.display="flex"

}


document
.getElementById(
"searchInput"
)

.addEventListener(

"keydown",

e=>{

if(

e.key==="Enter"

)

searchMap()

}

)

</script>

</body>

</html>
