<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>집탐 | 집 보기 전에 먼저 둘러보세요</title>
<meta name="description" content="집탐 ZipTam - 집 보기 전에 먼저 둘러보세요. 동네, 매물, 학교, 옵션을 쉽게 탐색하세요.">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#fff;
  color:#111;
}

button{font-family:inherit}

#home{
  min-height:72vh;
  background:
    linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.38)),
    url("./Image.jpeg");
  background-size:cover;
  background-position:center 82%;
  background-repeat:no-repeat;
  display:flex;
  flex-direction:column;
  color:white;
  overflow:hidden;
}

.homeHeader{
  height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
}

.logo{
  font-size:28px;
  font-weight:900;
  cursor:pointer;
}

.navLinks{
  display:flex;
  align-items:center;
  gap:14px;
}

.navLinks button{
  border:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.12);
  color:white;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  font-size:15px;
}

.navLinks button:hover{
  background:rgba(255,255,255,.22);
}

.hero{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px 20px 90px;
}

.hero h1{
  font-size:86px;
  margin-bottom:14px;
}

.hero h2{
  font-size:34px;
  margin-bottom:18px;
}

.hero p{
  font-size:22px;
  margin-bottom:42px;
}

.search{
  display:flex;
  width:800px;
  max-width:92%;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}

.search input{
  flex:1;
  padding:26px;
  font-size:24px;
  border:none;
  outline:none;
  border-radius:18px 0 0 18px;
}

.search button{
  width:150px;
  border:none;
  background:black;
  color:white;
  font-size:22px;
  cursor:pointer;
  border-radius:0 18px 18px 0;
}

#mapPage{
  display:none;
  height:100vh;
}

.mapHeader{
  height:82px;
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 24px;
  background:white;
  border-bottom:1px solid #e5e5e5;
}

.mapLogo{
  font-size:26px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
}

.topSearch{
  flex:1;
  display:flex;
  justify-content:center;
}

.topSearchBox{
  display:flex;
  width:560px;
  max-width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}

.topSearchBox input{
  flex:1;
  border:none;
  padding:16px 18px;
  font-size:18px;
  outline:none;
}

.topSearchBox button{
  width:90px;
  border:none;
  background:black;
  color:white;
  font-size:17px;
  cursor:pointer;
}

.mapNav{
  display:flex;
  gap:10px;
  align-items:center;
}

.mapNav button{
  padding:10px 14px;
  border:1px solid #ddd;
  background:white;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

.mapNav .dark{
  background:#111;
  color:white;
  border-color:#111;
}

.filters{
  height:68px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 24px;
  background:white;
  border-bottom:1px solid #e5e5e5;
  overflow-x:auto;
}

.filterBtn{
  padding:12px 18px;
  border:1px solid #ccc;
  background:white;
  border-radius:999px;
  font-size:16px;
  cursor:pointer;
  white-space:nowrap;
}

.filterBtn:hover,
.filterBtn.active{
  border-color:#111;
  background:#111;
  color:white;
}

.content{
  display:flex;
  height:calc(100vh - 150px);
}

.mapWrap{
  flex:1;
  min-width:0;
}

#map{
  width:100%;
  height:100%;
}

.listPanel{
  width:430px;
  border-left:1px solid #ddd;
  background:#fff;
  display:flex;
  flex-direction:column;
}

.panelTop{
  height:64px;
  padding:14px 18px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panelTitle{
  font-size:18px;
  font-weight:900;
}

.fullBtn{
  border:1px solid #ccc;
  background:white;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-size:14px;
}

.propertyList{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.propertyCard{
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  margin-bottom:10px;
  cursor:pointer;
  background:white;
}

.propertyCard:hover{
  background:#f8f8f8;
}

.propertyTitle{
  font-size:17px;
  font-weight:900;
  margin-bottom:8px;
}

.propertyMeta{
  font-size:15px;
  color:#333;
  line-height:1.5;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.propertySub{
  font-size:13px;
  color:#777;
  margin-top:6px;
}

.fullscreenList .mapWrap{
  display:none;
}

.fullscreenList .listPanel{
  width:100%;
  border-left:none;
}

.fullscreenList .propertyList{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  align-content:start;
  padding:20px;
}

.fullscreenList .propertyCard{
  margin-bottom:0;
  min-height:130px;
}

.footer{
  background:#111;
  color:white;
  padding:56px 70px 28px;
}

.footerWrap{
  display:flex;
  justify-content:space-between;
  gap:48px;
  flex-wrap:wrap;
}

.footer h3,
.footer h4{
  margin-bottom:16px;
}

.footer p{
  color:#bbb;
}

.footer a{
  display:block;
  color:#bbb;
  text-decoration:none;
  margin-bottom:10px;
  font-size:14px;
}

.footer a:hover{
  color:white;
}

.copyright{
  margin-top:42px;
  padding-top:20px;
  border-top:1px solid #333;
  color:#888;
  font-size:13px;
}

@media(max-width:1000px){
  .mapHeader{
    gap:10px;
  }

  .mapNav button{
    display:none;
  }

  .content{
    flex-direction:column;
  }

  .mapWrap{
    height:58%;
  }

  .listPanel{
    width:100%;
    height:42%;
    border-left:none;
    border-top:1px solid #ddd;
  }

  .fullscreenList .propertyList{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div id="home">
  <div class="homeHeader">
    <div class="logo" onclick="goHome()">ZipTam 집탐</div>

    <div class="navLinks">
      <button onclick="showFavoriteMessage()">관심매물</button>
      <button onclick="showBrokerMessage()">중개인 페이지</button>
      <button onclick="showLoginMessage()">로그인</button>
    </div>
  </div>

  <div class="hero">
    <h1>집탐</h1>
    <h2>집을 탐색하다</h2>
    <p>집 보기 전에 먼저 둘러보세요</p>

    <div class="search">
      <input id="searchInput" placeholder="동네 · 아파트 · 주소 검색">
      <button onclick="searchMap()">검색</button>
    </div>
  </div>

  <footer class="footer">
    <div class="footerWrap">
      <div>
        <h3>ZipTam 집탐</h3>
        <p>집 보기 전에 먼저 둘러보세요.</p>
      </div>

      <div>
        <h4>회사</h4>
        <a href="#">회사 소개</a>
        <a href="#">이용약관</a>
        <a href="#">개인정보처리방침</a>
        <a href="#">문의하기</a>
      </div>

      <div>
        <h4>서비스</h4>
        <a href="#">관심매물</a>
        <a href="#">매물 등록</a>
        <a href="#">학교 정보</a>
        <a href="#">지도 검색</a>
      </div>

      <div>
        <h4>중개인</h4>
        <a href="#">중개인 등록</a>
        <a href="#">공인중개사 인증</a>
        <a href="#">매물 관리</a>
      </div>

      <div>
        <h4>언어</h4>
        <a href="#">한국어</a>
        <a href="#">English</a>
      </div>
    </div>

    <div class="copyright">
      © 2026 ZipTam. All rights reserved.
    </div>
  </footer>
</div>

<div id="mapPage">
  <div class="mapHeader">
    <div class="mapLogo" onclick="goHome()">ZipTam 집탐</div>

    <div class="topSearch">
      <div class="topSearchBox">
        <input id="mapSearchInput" placeholder="동네 · 아파트 · 주소 검색">
        <button onclick="searchFromMap()">검색</button>
      </div>
    </div>

    <div class="mapNav">
      <button onclick="showFavoriteMessage()">관심매물</button>
      <button onclick="showBrokerMessage()">중개인 페이지</button>
      <button onclick="showLoginMessage()">로그인</button>
      <button class="dark" onclick="goHome()">처음으로</button>
    </div>
  </div>

  <div class="filters">
    <button class="filterBtn" onclick="toggleFilter(this)">가격</button>
    <button class="filterBtn" onclick="toggleFilter(this)">평수</button>
    <button class="filterBtn" onclick="toggleFilter(this)">방 / 화장실</button>
    <button class="filterBtn" onclick="toggleFilter(this)">아파트</button>
    <button class="filterBtn" onclick="toggleFilter(this)">주상복합</button>
    <button class="filterBtn" onclick="toggleFilter(this)">빌라</button>
    <button class="filterBtn" onclick="toggleFilter(this)">단독주택</button>
    <button class="filterBtn" onclick="toggleFilter(this)">주차</button>
    <button class="filterBtn" onclick="toggleFilter(this)">관리비</button>
    <button class="filterBtn" onclick="toggleFilter(this)">공동현관</button>
    <button class="filterBtn" onclick="toggleFilter(this)">학교</button>
    <button class="filterBtn" onclick="toggleFilter(this)">옵션 / 필터</button>
  </div>

  <div id="content" class="content">
    <div class="mapWrap">
      <div id="map"></div>
    </div>

    <aside class="listPanel">
      <div class="panelTop">
        <div class="panelTitle" id="panelTitle">검색 결과</div>
        <button class="fullBtn" onclick="toggleListMode()" id="fullBtn">전체화면</button>
      </div>

      <div class="propertyList" id="propertyList"></div>
    </aside>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let marker;
let boundary;
let listFullMode=false;

const namsan={lat:37.5512,lng:126.9882,zoom:13};

const localData={
  "압구정":{lat:37.527,lng:127.028,full:"서울특별시 강남구 압구정동",short:"압구정"},
  "압구정동":{lat:37.527,lng:127.028,full:"서울특별시 강남구 압구정동",short:"압구정"},
  "잠실":{lat:37.513,lng:127.101,full:"서울특별시 송파구 잠실동",short:"잠실"},
  "잠실동":{lat:37.513,lng:127.101,full:"서울특별시 송파구 잠실동",short:"잠실"},
  "방이동":{lat:37.511,lng:127.116,full:"서울특별시 송파구 방이동",short:"방이동"},
  "성수동":{lat:37.544,lng:127.056,full:"서울특별시 성동구 성수동",short:"성수동"},
  "미사":{lat:37.563,lng:127.193,full:"경기도 하남시 미사",short:"미사"},
  "연수동":{lat:37.410,lng:126.678,full:"인천광역시 연수구 연수동",short:"연수동"},
  "판교":{lat:37.394,lng:127.111,full:"경기도 성남시 판교",short:"판교"},
  "강남":{lat:37.497,lng:127.027,full:"서울특별시 강남구",short:"강남"},
  "송파":{lat:37.514,lng:127.105,full:"서울특별시 송파구",short:"송파"}
};

const sampleListings=[
  {title:"현대아파트",price:"32억",size:"34평",room:"방3",bath:"욕실2",type:"아파트",parking:"세대당 1.4대",fee:"관리비 28만원"},
  {title:"신현대",price:"28억",size:"31평",room:"방3",bath:"욕실2",type:"아파트",parking:"세대당 1.2대",fee:"관리비 24만원"},
  {title:"미성아파트",price:"24억",size:"28평",room:"방3",bath:"욕실1",type:"아파트",parking:"세대당 1.0대",fee:"관리비 21만원"},
  {title:"한양빌라",price:"18억",size:"26평",room:"방3",bath:"욕실2",type:"빌라",parking:"주차 가능",fee:"관리비 12만원"},
  {title:"압구정 단독주택",price:"45억",size:"55평",room:"방5",bath:"욕실3",type:"단독주택",parking:"2대",fee:"관리비 없음"},
  {title:"로얄팰리스",price:"21억",size:"29평",room:"방3",bath:"욕실2",type:"주상복합",parking:"세대당 1.6대",fee:"관리비 35만원"},
  {title:"리버뷰 레지던스",price:"19억",size:"25평",room:"방2",bath:"욕실2",type:"오피스텔",parking:"세대당 1.1대",fee:"관리비 30만원"},
  {title:"한강뷰 아파트",price:"38억",size:"42평",room:"방4",bath:"욕실2",type:"아파트",parking:"세대당 1.8대",fee:"관리비 40만원"}
];

function showMap(lat,lng,zoom,title,shortName){
  document.getElementById("home").style.display="none";
  document.getElementById("mapPage").style.display="block";

  const name=shortName||title;

  document.getElementById("mapSearchInput").value=name;
  document.getElementById("panelTitle").innerText=name+" 검색 결과";

  renderListings(name);

  setTimeout(()=>{
    if(!map){
      map=L.map("map");

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
        maxZoom:19,
        attribution:"© OpenStreetMap"
      }).addTo(map);
    }

    map.setView([lat,lng],zoom);

    if(marker){map.removeLayer(marker)}
    if(boundary){map.removeLayer(boundary)}

    marker=L.marker([lat,lng])
      .addTo(map)
      .bindPopup(title)
      .openPopup();

    boundary=L.circle([lat,lng],{
      radius:1500,
      color:"blue",
      fill:true,
      fillOpacity:.1
    }).addTo(map);

    map.invalidateSize();
  },150);
}

function renderListings(areaName){
  const list=document.getElementById("propertyList");
  list.innerHTML="";

  sampleListings.forEach(item=>{
    const card=document.createElement("div");
    card.className="propertyCard";

    card.innerHTML=`
      <div class="propertyTitle">${item.title}</div>
      <div class="propertyMeta">${item.price} · ${item.size} · ${item.room} · ${item.bath}</div>
      <div class="propertyMeta">${item.type} · ${item.parking} · ${item.fee}</div>
      <div class="propertySub">${areaName} 샘플 매물 · 관심매물 저장은 로그인 필요</div>
    `;

    list.appendChild(card);
  });
}

async function runSearch(query){
  if(!query){
    showMap(namsan.lat,namsan.lng,14,"남산","남산");
    return;
  }

  if(localData[query]){
    showMap(localData[query].lat,localData[query].lng,15,localData[query].full,localData[query].short);
    return;
  }

  try{
    const url=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query+" 한국")}`;
    const res=await fetch(url);
    const data=await res.json();

    if(data.length){
      showMap(Number(data[0].lat),Number(data[0].lon),15,data[0].display_name,query);
    }else{
      alert("검색 결과 없음");
    }
  }catch{
    alert("검색 실패");
  }
}

function searchMap(){
  const q=document.getElementById("searchInput").value.trim();
  runSearch(q);
}

function searchFromMap(){
  const q=document.getElementById("mapSearchInput").value.trim();
  runSearch(q);
}

function goHome(){
  document.getElementById("mapPage").style.display="none";
  document.getElementById("home").style.display="flex";

  listFullMode=false;
  document.getElementById("content").classList.remove("fullscreenList");
  document.getElementById("fullBtn").innerText="전체화면";
}

function toggleListMode(){
  listFullMode=!listFullMode;

  const content=document.getElementById("content");
  const btn=document.getElementById("fullBtn");

  if(listFullMode){
    content.classList.add("fullscreenList");
    btn.innerText="지도 보기";
  }else{
    content.classList.remove("fullscreenList");
    btn.innerText="전체화면";
    setTimeout(()=>{if(map){map.invalidateSize()}},100);
  }
}

function toggleFilter(btn){
  btn.classList.toggle("active");
}

function showLoginMessage(){
  alert("로그인 기능 준비 중입니다.");
}

function showFavoriteMessage(){
  alert("관심매물 저장은 로그인 후 이용 가능합니다.");
}

function showBrokerMessage(){
  alert("중개인 페이지는 사업자/공인중개사 인증 후 이용 가능합니다.");
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") searchMap();
});

document.getElementById("mapSearchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") searchFromMap();
});
</script>

</body>
</html>
